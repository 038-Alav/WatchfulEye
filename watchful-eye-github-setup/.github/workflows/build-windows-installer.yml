name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: ./scripts/build_windows_installer.ps1

      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: WatchfulEye-Windows-Installer
          path: dist/installer/WatchfulEye-Setup-*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $installer = Get-ChildItem "dist/installer/WatchfulEye-Setup-*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Installer executable was not found."
          }

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $installer.FullName --clobber
          }
          else {
            gh release create $tag $installer.FullName --title "Watchful Eye $tag" --generate-notes
          }

          if ($LASTEXITCODE -ne 0) {
            throw "Could not publish the installer to GitHub Releases."
          }

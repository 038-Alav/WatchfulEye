[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "watchful-eye"
version = "0.2.0"
description = "Local network discovery and device inventory desktop application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "psutil>=5.9",
    "scapy>=2.5",
    "zeroconf>=0.131",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
build = [
    "pyinstaller>=6.10",
]

[project.gui-scripts]
watchful-eye = "watchfuleye.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
watchfuleye = ["data/oui.txt"]
